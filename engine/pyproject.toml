[project]
name = "misty-engine"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx",
  "h2",
  "pyyaml",
  "keyring",
  "sqlite-vec==0.1.9",
  "numpy",
  "pypdf>=6.20.1",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1.5",
  "beautifulsoup4>=4.15.0",
  "pillow>=12.3.0",
  "pillow-heif>=1.8.1",
  "mlx>=0.32.3",
  "transformers>=5.18.0",
  "mlx-vlm",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
  "google-api-python-client>=2.201.0",
  "google-auth-oauthlib>=1.5.0",
  "watchdog>=6.0.0",
  "mlx-whisper>=0.4.3",
  "sympy>=1.13",
]

[project.scripts]
misty = "misty_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/misty_engine"]

[tool.uv.sources]
mlx-vlm = { git = "https://github.com/Blaizzy/mlx-vlm.git", rev = "3d87e88402f307efbf68e568971aa887ee7d9ed0" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpserver",
    "pytest-timeout>=2.4.0",
]
